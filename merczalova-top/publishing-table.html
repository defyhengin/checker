// ===== ОТРИСОВКА =====
const tabs=document.getElementById('tabs'), view=document.getElementById('view');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function show(id){
  const ep=DATA.find(e=>e.id===id)||DATA[1];
  [...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===ep.id));
  let h=`<div class="ep-head">${esc(ep.title)}${ep.status?`<span class="status ${ep.status==='готово'?'ok':''}">${ep.status}</span>`:''}</div>`;
  if(ep.note) h+=`<div class="note">${esc(ep.note)}</div>`;
  ep.platforms.forEach(p=>{
    h+=`<div class="plat">${esc(p.name)}</div>`;
    p.fields.forEach(([l,v])=>{
      h+=`<div class="field"><div class="row"><span class="label">${esc(l)}</span>`+
        (v?`<button class="copy" data-v="${encodeURIComponent(v)}">Копировать</button>`:'')+
        `</div><div class="val ${v?'':'empty'}">${v?esc(v):'пока нет'}</div></div>`;
    });
  });
  view.innerHTML=h;
  try{localStorage.setItem('mt_tab',ep.id)}catch(e){}
  if(location.hash!=='#'+ep.id) history.replaceState(null,'','#'+ep.id);
}
DATA.forEach(e=>{const b=document.createElement('button');b.className='tab';b.textContent=e.tab;b.dataset.id=e.id;b.onclick=()=>show(e.id);tabs.appendChild(b)});
view.addEventListener('click',async ev=>{
  const b=ev.target.closest('button.copy'); if(!b) return;
  const v=decodeURIComponent(b.dataset.v);
  let ok=false;
  try{await navigator.clipboard.writeText(v);ok=true}catch(e){
    const t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();
    try{ok=document.execCommand('copy')}catch(_){}
    t.remove();
  }
  b.textContent=ok?'Скопировано ✓':'Выдели текст';b.classList.toggle('done',ok);
  setTimeout(()=>{b.textContent='Копировать';b.classList.remove('done')},1600);
});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
let start=location.hash.slice(1);
if(!start){try{start=localStorage.getItem('mt_tab')}catch(e){}}
show(start||'ep1');
</script>
